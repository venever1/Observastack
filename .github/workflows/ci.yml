name: CI/CD

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # golangci-lint-action v7+ supports golangci-lint v2 only, and v2 config
      # files (version: "2") are rejected by v1, so the action and the binary
      # must move together. v8 requires golangci-lint >= v2.1.0.
      #
      # Pinned to an exact patch, not the v2.13 minor. Specifying a minor makes
      # the action resolve the latest patch at run time, so CI would silently
      # start using a different binary than the one verified locally whenever a
      # new patch ships. Keep this exact version in step with run.go in
      # .golangci.yml and with the version used for local runs.
      #
      # v2.13.2 is the first release built with go1.27, which go.mod targets. An
      # older binary exits with "the Go language version used to build
      # golangci-lint is lower than the targeted Go version" and the job fails
      # before linting anything.
      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: Run tests
        run: go test -race -v ./...

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
